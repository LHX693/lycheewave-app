name: windows-test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose Windows assets are tested
        default: v0.3.0
        required: true
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          New-Item -ItemType Directory -Force rel | Out-Null
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -D rel -p '*win-x64*' -p 'SHA256SUMS.txt'
          Get-ChildItem rel
      - name: Run Windows tests
        shell: pwsh
        run: ./scripts/windows-test.ps1 -Rel rel -Out wt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: wt
