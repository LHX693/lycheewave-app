name: windows-test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose Windows assets are tested (draft releases allowed)
        default: v0.3.0
        required: true
  release:
    types: [published]
permissions:
  contents: read
jobs:
  fetch:
    # Only job with write scope: GitHub requires it to read *draft* release assets. It runs no repo code.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir rel
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D rel -p '*win-x64*' -p 'SHA256SUMS.txt'
          ls -la rel
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: rel
          retention-days: 1
  test:
    needs: fetch
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: rel
      - name: Run Windows tests
        shell: pwsh
        run: ./scripts/windows-test.ps1 -Rel rel -Out wt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: wt
